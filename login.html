<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Login | TS BGMI Esports</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>


<main class="admin-login-page">


  <div class="admin-login-card">


    <div class="admin-logo">

      <strong>TS</strong>

      <span>
        BGMI
        <small>ESPORTS</small>
      </span>

    </div>


    <div class="admin-login-header">

      <span class="eyebrow">
        PRIVATE PANEL
      </span>

      <h1>
        Admin Login
      </h1>

      <p>
        Authorized administrators only.
      </p>

    </div>


    <form id="adminLoginForm">


      <div class="input-group">

        <label for="adminEmail">
          Admin Email
        </label>

        <input
          type="email"
          id="adminEmail"
          placeholder="Enter admin email"
          required
        >

      </div>


      <button
        type="submit"
        id="adminLoginButton"
        class="submit-registration"
      >
        SEND LOGIN LINK
      </button>


      <p
        id="adminLoginMessage"
        class="message"
      ></p>


    </form>


  </div>


</main>



<script type="module">

import {
  auth,
  sendSignInLinkToEmail,
  isSignInWithEmailLink,
  signInWithEmailLink
} from "./firebase.js";


/*
  IMPORTANT:
  Replace this with your Firebase Admin UID.
*/

const ADMIN_UID =
  "YOUR_ADMIN_UID_HERE";


const form =
  document.getElementById(
    "adminLoginForm"
  );


const emailInput =
  document.getElementById(
    "adminEmail"
  );


const button =
  document.getElementById(
    "adminLoginButton"
  );


const message =
  document.getElementById(
    "adminLoginMessage"
  );



/*
  SEND LOGIN LINK
*/

form.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();


    const email =
      emailInput.value.trim();


    if (!email) {

      message.textContent =
        "Please enter your admin email.";

      message.className =
        "message error";

      return;

    }


    button.disabled =
      true;


    button.textContent =
      "SENDING...";


    try {

      const actionCodeSettings = {

        url:
          window.location.origin +
          window.location.pathname,

        handleCodeInApp:
          true

      };


      await sendSignInLinkToEmail(
        auth,
        email,
        actionCodeSettings
      );


      localStorage.setItem(
        "adminEmailForSignIn",
        email
      );


      message.textContent =
        "Login link sent. Check your email.";

      message.className =
        "message success";


      button.textContent =
        "LOGIN LINK SENT";


    } catch (error) {

      console.error(error);


      message.textContent =
        error.message ||
        "Unable to send login link.";

      message.className =
        "message error";


      button.disabled =
        false;


      button.textContent =
        "SEND LOGIN LINK";

    }

  }
);



/*
  COMPLETE EMAIL LINK LOGIN
*/

if (
  isSignInWithEmailLink(
    auth,
    window.location.href
  )
) {

  let email =
    localStorage.getItem(
      "adminEmailForSignIn"
    );


  if (!email) {

    email =
      window.prompt(
        "Enter your admin email:"
      );

  }


  if (!email) {

    message.textContent =
      "Admin email is required.";

    message.className =
      "message error";

  } else {


    try {

      message.textContent =
        "Verifying admin account...";

      message.className =
        "message";


      const result =
        await signInWithEmailLink(
          auth,
          email,
          window.location.href
        );


      localStorage.removeItem(
        "adminEmailForSignIn"
      );


      /*
        UID SECURITY CHECK
      */

      if (
        result.user.uid !==
        ADMIN_UID
      ) {

        await auth.signOut();


        message.textContent =
          "Access denied. This account is not authorized as admin.";

        message.className =
          "message error";


        return;

      }


      /*
        ADMIN VERIFIED
      */

      message.textContent =
        "Admin verified. Opening dashboard...";

      message.className =
        "message success";


      window.location.href =
        "index.html";


    } catch (error) {

      console.error(error);


      message.textContent =
        "Login failed. Please request a new login link.";

      message.className =
        "message error";

    }

  }

}

</script>


</body>

</html>
